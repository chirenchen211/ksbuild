name: build

# 触发：push / 网页手动 Run workflow
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Theos 和 iOS SDK
        run: |
          set -e
          brew install ldid xz dpkg || true
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks | head
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: 编译 KillSwitch.dylib
        run: |
          set -e
          cd KillSwitch
          make clean || true
          make -j4 DEBUG=0 FINALPACKAGE=1
          echo "--- all built dylibs ---"
          find .theos/obj -name "KillSwitch.dylib" -exec ls -l {} \;

      - name: 收集产物（排除 dSYM）
        run: |
          set -e
          mkdir -p dist
          f=$(find KillSwitch/.theos/obj -name "KillSwitch.dylib" -not -path "*.dSYM/*" | head -n 1)
          echo "picked: $f"
          cp "$f" dist/KillSwitch.dylib
          ls -l dist
          file dist/KillSwitch.dylib
          python3 - <<'PY'
          import struct
          d = open("dist/KillSwitch.dylib","rb").read(32)
          magic, cpu, sub, ftype = struct.unpack("<IIII", d[:16])
          print("magic=%08x cputype=%08x filetype=%d" % (magic, cpu, ftype))
          assert magic == 0xFEEDFACF, "not 64-bit mach-o"
          assert ftype == 6, "not MH_DYLIB (filetype=%d)" % ftype
          print("macho check ok")
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KillSwitch-dylib
          path: dist/KillSwitch.dylib
          if-no-files-found: error
