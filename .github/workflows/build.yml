name: build

# 触发：push / 网页手动 Run workflow
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Theos 和 iOS SDK
        run: |
          set -e
          brew install ldid xz dpkg || true
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks | head
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: 编译 KillSwitch.dylib
        run: |
          set -e
          cd KillSwitch
          make clean || true
          make -j4 DEBUG=0 FINALPACKAGE=1
          echo "--- all built dylibs ---"
          find .theos/obj -name "KillSwitch.dylib" -exec ls -l {} \;

      - name: 收集产物（排除 dSYM）
        run: |
          set -e
          mkdir -p dist
          f=$(find KillSwitch/.theos/obj -name "KillSwitch.dylib" -not -path "*.dSYM/*" | head -n 1)
          echo "picked: $f"
          cp "$f" dist/KillSwitch.dylib
          ls -l dist
          file dist/KillSwitch.dylib
          python3 - <<'PY'
          import struct
          data = open("dist/KillSwitch.dylib","rb").read()
          magic_be = struct.unpack(">I", data[:4])[0]
          if magic_be == 0xCAFEBABE:
              n = struct.unpack(">I", data[4:8])[0]
              print("fat binary, %d slices" % n)
              ok = False
              for i in range(n):
                  off = 8 + i * 20
                  cpu, sub, offset, size, align = struct.unpack(">iiIII", data[off:off+20])
                  m, ft = struct.unpack("<II", data[offset:offset+8])
                  print("  slice %d: cpu=%08x offset=%d size=%d magic=%08x filetype=%d" % (i, cpu, offset, size, m, ft))
                  if m == 0xFEEDFACF and ft == 6:
                      ok = True
              assert ok, "no valid MH_DYLIB slice"
          else:
              m, cpu, sub, ft = struct.unpack("<IIII", data[:16])
              print("thin: magic=%08x filetype=%d" % (m, ft))
              assert m == 0xFEEDFACF and ft == 6, "not MH_DYLIB"
          print("macho check ok")
          PY

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KillSwitch-dylib
          path: dist/KillSwitch.dylib
          if-no-files-found: error
