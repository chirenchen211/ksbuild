name: build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup theos
        run: |
          set -e
          brew install ldid xz dpkg || true
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls $THEOS/sdks | head
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: build
        run: |
          set -e
          cd KillSwitch
          make clean || true
          make -j4 DEBUG=0 FINALPACKAGE=1
          find .theos/obj -name "KillSwitch.dylib" -exec ls -l {} \;

      - name: collect
        run: |
          set -e
          mkdir -p dist
          f=$(find KillSwitch/.theos/obj -name "KillSwitch.dylib" -not -path "*.dSYM/*" | head -n 1)
          echo "picked: $f"
          cp "$f" dist/KillSwitch.dylib
          ls -l dist
          file dist/KillSwitch.dylib
          file dist/KillSwitch.dylib | grep -q "dynamically linked shared library"
          file dist/KillSwitch.dylib | grep -q "arm64"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: KillSwitch-dylib
          path: dist/KillSwitch.dylib
          if-no-files-found: error
